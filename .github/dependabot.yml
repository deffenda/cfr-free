version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Give advisory databases time to catch up before merging updates.
    cooldown:
      default-days: 7
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    # typescript-eslint 8.71.2 rejects TypeScript 7, so a grouped bump fails
    # npm install in CI (PR #161); take the major once the lint stack
    # declares support.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    # The image pins its base by digest, so Dependabot's docker updates are
    # what keep that digest fresh.
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
