name: Release

# Cutting a `v*` tag runs the full CI gate plus a live container e2e (real
# eCFR sync inside the image), then publishes the image to GHCR with SLSA
# build provenance. Uses only the built-in GITHUB_TOKEN — no secrets needed.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: full CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: the package's `prepare` script runs the TypeScript
      # build, and this job builds explicitly in `npm run ci` — running it
      # during install would build twice.
      - run: npm ci --ignore-scripts
      - run: npm run ci

  container-e2e:
    name: container e2e (live sync + serve + mcp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t cfr-free:release .
      - name: Sync a real index inside the container
        run: docker run --rm -v cfr-release-vol:/data cfr-free:release sync
      - name: Serve and verify the HTTP surface
        run: |
          docker run -d --name cfr -v cfr-release-vol:/data -p 8787:8787 cfr-free:release
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/health >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:8787/health | grep '"status":"ok"'
          curl -fsS http://127.0.0.1:8787/metrics | grep -E '^cfr_free_sections [1-9]'
          curl -fsS 'http://127.0.0.1:8787/api/v1/search?q=mental+disorder&per_page=1' | grep '"citation"'
          docker rm -f cfr
      - name: MCP stdio handshake against the synced index
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"release-smoke","version":"1.0.0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"list_parts","arguments":{}}}' \
            | timeout 30 docker run --rm -i -v cfr-release-vol:/data cfr-free:release mcp \
            | grep -o 'Schedule for Rating Disabilities' | head -1

  publish:
    name: publish to GHCR
    needs: [ci, container-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # A GitHub Release with the packed tarball attached.
  #
  # Why this exists: the npm publish below is gated behind an operator-only
  # trusted-publishing registration, so a tag publishes an image to GHCR and
  # nothing else. The repository had TWO tags and NO GitHub releases, so the
  # releases page was empty and there was no downloadable artifact at all —
  # the one install route that needs neither a registry nor a compiler.
  #
  # The tarball is the same `npm pack` output the npm job publishes, so the
  # two cannot drift. It is attached to the tag, and the release notes are
  # generated from the commits since the previous tag.
  github-release:
    name: GitHub release with the tarball
    needs: [ci, container-e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous tag is needed for the release notes
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: pack the tarball
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          test "$TAG" = "$PKG" || { echo "tag v$TAG != package.json $PKG — bump package.json before tagging"; exit 1; }
          npm pack --pack-destination ./
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          # The range can legitimately be EMPTY — a first release tagged on
          # the root commit has no commits after it — and an empty range
          # exits 0, so a `||` fallback never fires. The emptiness is
          # therefore checked explicitly.
          NOTES="$(git log --pretty='- %s (%h)' "${PREV:-$(git rev-list --max-parents=0 HEAD)}..${GITHUB_REF_NAME}" 2>/dev/null || true)"
          if [ -z "$NOTES" ]; then
            NOTES="$(git log -1 --pretty='- %s (%h)' "${GITHUB_REF_NAME}")"
          fi
          {
            echo "## Title 38 CFR (38 C.F.R.) as a local, offline, self-hosted service"
            echo
            echo "Install the packed tarball — no registry, no compiler, no build step:"
            echo
            echo '```bash'
            echo "npm install -g https://github.com/deffenda/cfr-free/releases/download/${GITHUB_REF_NAME}/cfr-free-${PKG}.tgz"
            echo '```'
            echo
            echo "Or run it without installing:"
            echo
            echo '```bash'
            echo "npx -y github:deffenda/cfr-free serve"
            echo '```'
            echo
            echo "Or use the container image, which needs neither:"
            echo
            echo '```bash'
            echo "docker run -d --name cfr-free -p 8787:8787 -v cfr-data:/data ghcr.io/deffenda/cfr-free:${GITHUB_REF_NAME#v}"
            echo '```'
            echo
            echo "### Changes"
            echo
            echo "$NOTES"
          } > release-notes.md
          # --verify-tag: without it, `gh release create` CREATES a tag from
          # the default branch when the tag is missing, which would attach
          # these bytes to the wrong commit. The tag is always present here
          # (the workflow triggers on a tag push), so this only turns a
          # silent wrong-artifact path into a loud failure.
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "cfr-free ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "cfr-free-${PKG}.tgz"

  # Preserved invariants for publish-npm (HIGH-risk release infra; do not remove):
  # - activation gate: `if: vars.NPM_TRUSTED_PUBLISHING == 'true'` (publishing stays disabled until operator sets it)
  # - dependency: `needs: [ci]`
  # - permissions block: contents: read, id-token: write
  # - tag/package version match step
  # - `--provenance` on both the dry-run and the real publish
  # Activation gate (operator-only): set repo variable NPM_TRUSTED_PUBLISHING=true
  # AND register the trusted publisher on npmjs.com for this package: GitHub Actions
  # -> deffenda/cfr-free -> release.yml (one-time; first publish must land within 2 days).
  publish-npm:
    name: publish to npm (OIDC provenance)
    needs: [ci]
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) — no token secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm
      # --ignore-scripts: the package's `prepare` script builds, and this
      # job builds explicitly on the next line — running it during install
      # would build twice.
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: tag/package version match
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag v$TAG != package.json $PKG — bump package.json before tagging"; exit 1; }
      - name: verify packed executable and imports
        run: |
          node <<'NODE'
          const { execSync } = require('node:child_process');
          const fs = require('node:fs');
          const src = fs.readFileSync('src/cli.ts', 'utf8');
          const imports = [...src.matchAll(/from\s+['"](\.\/[^'"]+\.js)['"]/g)].map(m => m[1]);
          const expected = new Set(['dist/cli.js']);
          for (const imp of imports) expected.add('dist/' + imp.replace(/^\.\//, ''));
          const out = execSync('npm pack --dry-run --ignore-scripts --json', { encoding: 'utf8' });
          const parsed = JSON.parse(out);
          const files = new Set((parsed[0]?.files || []).map(f => f.path));
          const missing = [...expected].filter(f => !files.has(f));
          if (missing.length) {
            console.error('Missing from packed package:');
            for (const f of missing) console.error('  ' + f);
            process.exit(1);
          }
          console.log('Packed package contains executable and all imports:');
          for (const f of expected) console.log('  ' + f);
          NODE
      - name: executable smoke
        run: node dist/cli.js --help
      - name: publish (dry-run first)
        run: npm publish --dry-run --provenance
      - name: publish
        run: npm publish --provenance
