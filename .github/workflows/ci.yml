name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts: the package's `prepare` script runs the TypeScript
      # build, and this job builds explicitly in `npm run ci` — running it
      # during install would build twice.
      - run: npm ci --ignore-scripts
      - run: npm run ci
      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks can scan commits.
          fetch-depth: 0
      - name: gitleaks (secrets)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: osv-scanner (dependency advisories)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: --lockfile package-lock.json

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t cfr-free:ci .
      - name: Offline smoke — version and empty-index exit code
        # Deliberately network-free: the image must work without eCFR, and an
        # empty index with auto-sync off must exit 3 with a sync hint. The
        # full sync+serve+MCP e2e runs in the release workflow on tags.
        run: |
          docker run --rm cfr-free:ci version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          set +e
          out=$(docker run --rm -e CFR_AUTO_SYNC=0 cfr-free:ci serve 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 3
          echo "$out" | grep -F 'cfr-free sync'
