name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A push to main re-tests a tree a pull_request run has already
        # validated: squash merges keep the tree byte-identical (checked
        # on PRs #128, #130, #131, #132 — identical tree hashes), so the
        # second leg has nothing left to prove there. Node 22 is the floor
        # `engines` claims (>=22.5), so it is the leg the branch itself
        # needs. The condition lives in the matrix because a *job-level*
        # `if` cannot see the `matrix` context — attempting it invalidates
        # the whole workflow, which GitHub reports as a failed run with
        # zero jobs rather than as a filter that did not match.
        node: ${{ github.event_name == 'pull_request' && fromJSON('[22, 24]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts: the package's `prepare` script runs the TypeScript
      # build, and this job builds explicitly in `npm run ci` — running it
      # during install would build twice.
      - run: npm ci --ignore-scripts
      # `npm run ci` runs these six steps in this order for local use. CI
      # calls them individually so a failure names itself: four of the
      # five failures in the week to 2026-10-22 surfaced only as
      # "Run npm run ci", which sends the reader back to a local
      # reproduction to learn what actually failed.
      - name: format (prettier)
        run: npm run format:check
      - name: lint (eslint)
        run: npm run lint
      - name: typecheck (tsc --noEmit)
        run: npm run typecheck
      - name: test (vitest, coverage)
        run: npm run test:coverage
      - name: build (tsc)
        run: npm run build
      - name: audit (npm audit, high)
        run: npm run scan:audit
      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks can scan commits.
          fetch-depth: 0
      - name: gitleaks (secrets)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: osv-scanner (dependency advisories)
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: --lockfile package-lock.json

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # v1.7.12 is the version AGENTS.md blesses for `npm run lint:actions`:
      # the local gate and this job must lint the same way.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # Silent failure this prevents: a workflow that is valid YAML but
      # invalid to GitHub's expression parser — a job-level `if` reading the
      # `matrix` context, for instance — yields a failed run with zero jobs,
      # so no check ever reports and the pull request can never go green.
      # The path is quoted for the shell, not for YAML: the inner double
      # quotes keep shellcheck's SC2046 (an unquoted command substitution)
      # out of the run and keep a GOPATH containing spaces one path.
      - name: actionlint (workflow lint)
        run: '"$(go env GOPATH)/bin/actionlint"'

  docker:
    name: docker
    runs-on: ubuntu-latest
    # Same tree-identity argument as the second quality leg: the image a
    # squash-merged commit would build is the image the pull_request run
    # already built and smoke-tested. The release workflow builds and
    # e2e-tests the image from the tag, so main loses no container
    # coverage by skipping this.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t cfr-free:ci .
      - name: Offline smoke — version and empty-index exit code
        # Deliberately network-free: the image must work without eCFR, and an
        # empty index with auto-sync off must exit 3 with a sync hint. The
        # full sync+serve+MCP e2e runs in the release workflow on tags.
        run: |
          docker run --rm cfr-free:ci version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'
          set +e
          out=$(docker run --rm -e CFR_AUTO_SYNC=0 cfr-free:ci serve 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 3
          echo "$out" | grep -F 'cfr-free sync'
