      summary: Headers-only API index
      responses:
        '200':
          description: 'Status and headers as GET, empty body (src/titan/http-server.ts#sendJson); errors mirror GET, also body-less.'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/search:
    # source: src/titan/http-server.ts#dispatch (router), handleSearch (revalidatable send)
    get:
      summary: Full-text search over the local index
      responses:
        '200':
          description: 'Ranked hits plus the index freshness envelope; a query that is itself a citation (4.130, 38 CFR 4.16) is pinned first on page 1. Cache-Control: public, max-age=300.'
          headers:
            ETag:
              description: 'Strong validator over the response payload — a quoted sha256 of the exact response bytes ("sha256-<hex>", src/titan/http-server.ts#etagFor). Send it back as If-None-Match to revalidate.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: 'Conditional request — when this header matches the current ETag (weak comparison, RFC 9110 §13.1.2), the server answers 304 Not Modified with no body.'
          schema: { type: string }
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
        - name: part
          in: query
          description: Restrict to one CFR part.
          schema: { type: string, pattern: '^\d{1,3}$' }
        - name: kind
          in: query
          description: Restrict to one provision kind (section or appendix).
          schema: { type: string, enum: [section, appendix] }
        - name: chapter
          in: query
          description: 'Restrict to one chapter by Roman-numeral identifier — exact and case-sensitive (e.g. "I").'
          schema: { type: string, minLength: 1, maxLength: 8, pattern: '^[IVXLCDM]+$' }
    head:
      summary: Headers-only search probe
      responses:
        '200':
          description: 'Status and headers as GET, empty body (src/titan/http-server.ts#sendJson); errors mirror GET, also body-less.'
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: 'Conditional request — when this header matches the current ETag (weak comparison, RFC 9110 §13.1.2), the server answers 304 Not Modified with no body.'
          schema: { type: string }
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 200 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
        - name: part
          in: query
          description: Restrict to one CFR part.
          schema: { type: string, pattern: '^\d{1,3}$' }
        - name: kind
          in: query
          description: Restrict to one provision kind (section or appendix).
          schema: { type: string, enum: [section, appendix] }
        - name: chapter
          in: query
          description: 'Restrict to one chapter by Roman-numeral identifier — exact and case-sensitive (e.g. "I").'
          schema: { type: string, minLength: 1, maxLength: 8, pattern: '^[IVXLCDM]+$' }
  /api/v1/sections/{citation}:
    # source: src/titan/http-server.ts#dispatch (router), handleSection (revalidatable send)
    get:
      summary: Full text of one section or appendix
      responses:
        '200':
          description: 'Markdown + text + metadata + cross-references. Cache-Control: public, max-age=3600.'
          headers:
            ETag:
              description: 'Strong validator over the response payload — a quoted sha256 of the exact response bytes ("sha256-<hex>", src/titan/http-server.ts#etagFor). Send it back as If-None-Match to revalidate.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SectionDetail' }
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: 'Conditional request — when this header matches the current ETag (weak comparison, RFC 9110 §13.1.2), the server answers 304 Not Modified with no body.'
          schema: { type: string }
        - name: citation
          in: path
          required: true
          description: 'Citation or appendix name — 4.125, § 4.125, or 38 CFR 4.125 — URL-encoded (≤ 120 chars).'
          schema: { type: string, maxLength: 120 }
    head:
      summary: Headers-only section probe
      responses:
        '200':
          description: 'Status and headers as GET, empty body (src/titan/http-server.ts#sendJson); errors mirror GET, also body-less.'
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: 'Conditional request — when this header matches the current ETag (weak comparison, RFC 9110 §13.1.2), the server answers 304 Not Modified with no body.'
          schema: { type: string }
        - name: citation
          in: path
          required: true
          description: 'Citation or appendix name — 4.125, § 4.125, or 38 CFR 4.125 — URL-encoded (≤ 120 chars).'
          schema: { type: string, maxLength: 120 }
  /api/v1/browse:
    # source: src/titan/http-server.ts#dispatch (router), handleBrowse (revalidatable send)
    get:
      summary: Structure-tree navigation
      responses:
        '200':
          description: 'The node, its ancestor path, and its children; empty query returns the chapters. Cache-Control: public, max-age=3600.'
          headers:
            ETag:
              description: 'Strong validator over the response payload — a quoted sha256 of the exact response bytes ("sha256-<hex>", src/titan/http-server.ts#etagFor). Send it back as If-None-Match to revalidate.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowseResult' }
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: 'Conditional request — when this header matches the current ETag (weak comparison, RFC 9110 §13.1.2), the server answers 304 Not Modified with no body.'
          schema: { type: string }
        - name: chapter
          in: query
          description: Chapter identifier (1–20 chars).
          schema: { type: string, minLength: 1, maxLength: 20 }
        - name: part
          in: query
          description: 'Part identifier (1–20 chars); requires `chapter` (404 when absent or unresolvable).'
          schema: { type: string, minLength: 1, maxLength: 20 }
        - name: subpart
          in: query
          description: Subpart identifier (1–20 chars); requires `part`.
          schema: { type: string, minLength: 1, maxLength: 20 }
        - name: subjgrp
          in: query
          description: "Subject-group identifier (1–40 chars; the eCFR node id, e.g. `ECFRd158704dcab040e`); requires `part`. Subject groups hang off a part or a subpart, and hold the sections the flat tree could not reach (1,910 of the corpus's 2,953 sections)."
          schema: { type: string, minLength: 1, maxLength: 40 }
    head:
      summary: Headers-only browse probe
      responses:
        '200':
          description: 'Status and headers as GET, empty body (src/titan/http-server.ts#sendJson); errors mirror GET, also body-less.'
        '304': { $ref: '#/components/responses/NotModified' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: 'Conditional request — when this header matches the current ETag (weak comparison, RFC 9110 §13.1.2), the server answers 304 Not Modified with no body.'
          schema: { type: string }
        - name: chapter
          in: query
          description: Chapter identifier (1–20 chars).
          schema: { type: string, minLength: 1, maxLength: 20 }
        - name: part
          in: query
          description: 'Part identifier (1–20 chars); requires `chapter` (404 when absent or unresolvable).'
          schema: { type: string, minLength: 1, maxLength: 20 }
        - name: subpart
          in: query
          description: Subpart identifier (1–20 chars); requires `part`.
          schema: { type: string, minLength: 1, maxLength: 20 }
        - name: subjgrp
          in: query
          description: "Subject-group identifier (1–40 chars; the eCFR node id, e.g. `ECFRd158704dcab040e`); requires `part`. Subject groups hang off a part or a subpart, and hold the sections the flat tree could not reach (1,910 of the corpus's 2,953 sections)."
          schema: { type: string, minLength: 1, maxLength: 40 }
  /api/v1/diff:
    # source: src/titan/http-server.ts#dispatch
    get:
      summary: Point-in-time provision diff between two eCFR issue dates
      responses:
        '200':
          description: 'Provision-level diff of Title 38 between `from` and `to`: the changed, added and removed citations. Both dates are fetched from eCFR and hashed per citation on the fly (stateless — no local index, no cache). Each citation list is capped at 100 entries and `truncated: true` reports that at least one list was cut. Cache-Control: public, max-age=3600.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiffResult' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
        - name: from
          in: query
          required: true
          description: 'Start issue date (YYYY-MM-DD). Both `from` and `to` are required — this route has no default-to.'
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: to
          in: query
          required: true
          description: 'End issue date (YYYY-MM-DD), later than `from`.'
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
    head:
      summary: Headers-only diff probe
      responses:
        '200':
          description: 'Status and headers as GET, empty body (src/titan/http-server.ts#sendJson); errors mirror GET, also body-less.'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
        - name: from
          in: query
          required: true
          description: 'Start issue date (YYYY-MM-DD). Both `from` and `to` are required — this route has no default-to.'
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: to
          in: query
          required: true
          description: 'End issue date (YYYY-MM-DD), later than `from`.'
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
  /api/v1/redline:
    # source: src/titan/http-server.ts#dispatch
    get:
      summary: Line redline of one provision between two eCFR issue dates
      responses:
        '200':
          description: "Line redline of `citation` between `from` and `to`: status (changed/added/removed/unchanged), both sides' raw text, and one hunk per line (same/add/del with 1-based anchors into each side). Both dates are fetched from eCFR per call (stateless — no local index, no cache). The dates are SELECTORS — eCFR serves the revision in force on the requested date; they are not a verified stamp of which issue date was served. Cache-Control: public, max-age=300."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedlineResult' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
        - name: from
          in: query
          required: true
          description: 'Start date (YYYY-MM-DD) — a SELECTOR: eCFR serves the revision in force on the requested date, not a verified issue-date stamp. Both `from` and `to` are required — this route has no default-to.'
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: to
          in: query
          required: true
          description: 'End date (YYYY-MM-DD) — a SELECTOR with the same semantics as `from`.'
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: citation
          in: query
          required: true
          description: 'Provision to redline — 4.125, § 4.125, 38 CFR 4.125, or an appendix name (≤ 120 chars). Missing from BOTH dates → 404.'
          schema: { type: string, minLength: 1, maxLength: 120 }
    head:
      summary: Headers-only redline probe
      responses:
        '200':
          description: 'Status and headers as GET, empty body (src/titan/http-server.ts#sendJson); errors mirror GET, also body-less.'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
      parameters:
        - name: from
          in: query
          required: true
          description: 'Start date (YYYY-MM-DD) — a SELECTOR: eCFR serves the revision in force on the requested date, not a verified issue-date stamp.'
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: to
          in: query
          required: true
          description: 'End date (YYYY-MM-DD) — a SELECTOR with the same semantics as `from`.'
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        - name: citation
          in: query
          required: true
          description: 'Provision to redline — 4.125, § 4.125, 38 CFR 4.125, or an appendix name (≤ 120 chars). Missing from BOTH dates → 404.'
          schema: { type: string, minLength: 1, maxLength: 120 }
components:
  responses:
    BadRequest:
      # source: src/titan/http-server.ts#handleSection, precheck (encoding, URL parse, byte caps), statusFor (service input), handleDiff (diff params), handleRedline (redline params)
      description: '{ error: "invalid_input", message } — malformed URL or citation encoding, oversized q (800 bytes) or part (10 bytes), a service-level input rejection (incl. missing/empty `from`/`to` on /api/v1/diff, missing/empty `from`/`to`/`citation` on /api/v1/redline, and impossible dates like month 13).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      # source: src/titan/http-server.ts#dispatch (no route), statusFor (structure/service miss)
      description: '{ error: "not_found", message } — any path not listed here, a citation absent from the index, a citation missing from BOTH dates on /api/v1/redline, or a nonexistent browse node (browse adds `available`: the identifiers that do exist).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    MethodNotAllowed:
      # source: src/titan/http-server.ts#precheck
      description: '{ error: "method_not_allowed", message } — any method other than GET/HEAD, on any path.'
      headers:
        allow: { description: 'Always GET, HEAD.', schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UriTooLong:
      # source: src/titan/http-server.ts#precheck
      description: '{ error: "uri_too_long", message } — request URL over 2048 bytes.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      # source: src/titan/http-server.ts#precheck
      description: '{ error: "rate_limited", message } — per-peer token bucket exhausted (armed only when CFR_ALLOW_REMOTE=1; loopback never throttles).'
      headers:
        retry-after: { description: Seconds to wait., schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      # source: src/titan/http-server.ts#createHttpServer
      description: '{ error: "internal_error", message } — unexpected failure; details are logged server-side only.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotModified:
      # source: src/titan/http-server.ts#sendNotModified
      description: "Not modified — the request's If-None-Match matched the current ETag (weak comparison, RFC 9110 §13.1.2: `*` matches any representation, a list matches when any member matches, and a weak validator matches the strong one). The ETag and Cache-Control of the 200 it replaces, and NO body. Only the index-backed reads can answer this way; an error response never does."
      headers:
        ETag:
          description: 'The current strong validator — unchanged from the 200 it replaces.'
          schema: { type: string }
        Cache-Control:
          description: 'The same cache policy as the 200 it replaces.'
          schema: { type: string }
  schemas:
    ApiIndex:
      type: object
      required: [service, version, openapi, routes]
      properties:
        service: { type: string }
        version: { type: string }
        openapi:
          type: string
          description: The path this instance serves its OpenAPI document on.
        routes:
          type: array
          items:
            type: object
            required: [method, path, summary, required]
            properties:
              method: { type: string }
              path: { type: string }
              summary: { type: string }
              required:
                type: array
                items: { type: string }
                description: The parameters this route requires.
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: 'One of invalid_input, not_found, method_not_allowed, uri_too_long, rate_limited, internal_error.'
        message: { type: string }
        available: { type: array, items: { type: string } }
      additionalProperties: false
    Health:
      type: object
      description: Index freshness report — the literal `"ok"` plus `service.status()`.
      required:
        - status
        - issueDate
        - syncedAt
        - sections
        - appendices
        - stale
        - maxAgeDays
        - parserVersion
        - structureDrift
        - lastChanges
        - corpusHash
      properties:
        status: { type: string, enum: [ok] }
        issueDate: { type: [string, 'null'] }
        syncedAt: { type: [string, 'null'] }
        sections: { type: integer }
        appendices: { type: integer }
        stale: { type: boolean }
        maxAgeDays: { type: integer }
        parserVersion: { type: [string, 'null'] }
        structureDrift: { type: [boolean, 'null'], description: Null on older indexes. }
        corpusHash:
          type: [string, 'null']
          description: 'Sha256 over the sorted per-provision (citation, content-hash) pairs — content is text + heading; null on indexes built before the receipt existed.'
        diskFree:
          type: integer
          description: 'Bytes available to unprivileged users (bavail × bsize), as of boot or the last refresh round; omitted when no snapshot exists.'
        diskTotal:
          type: integer
          description: 'Total bytes on the volume hosting the index; present only when the platform exposes fs.statfs (as of boot or the last refresh round).'
        lastChanges:
          oneOf:
            - $ref: '#/components/schemas/SyncChanges'
            - type: 'null'
      additionalProperties: false
    SyncChanges:
      type: object
      description: What the most recent sync amended (per-citation sha256 diff).
      required:
        - fromIssueDate
        - toIssueDate
        - changed
        - added
        - removed
        - changedCitations
        - addedCitations
        - removedCitations
        - baseline
        - parserChanged
        - recordedAt
      properties:
        fromIssueDate: { type: [string, 'null'] }
        toIssueDate: { type: string }
        changed: { type: integer }
        added: { type: integer }
        removed: { type: integer }
        changedCitations: { type: array, items: { type: string }, description: Capped at 100. }
        addedCitations: { type: array, items: { type: string }, description: Capped at 100. }
        removedCitations: { type: array, items: { type: string }, description: Capped at 100. }
        baseline: { type: boolean, description: First sync (no previous index). }
        parserChanged: { type: boolean }
        recordedAt: { type: string }
      additionalProperties: false
    SearchResponse:
      type: object
      required:
        [
          query,
          page,
          perPage,
          total,
          matchMode,
          hits,
          indexIssueDate,
          indexStale,
          notice,
          matchedTerms,
          unmatchedTerms,
        ]
      properties:
        query: { type: string }
        page: { type: integer }
        perPage: { type: integer }
        total:
          type: integer
          description: 'Size of the candidate set: every provision matching at least one query term, plus the pinned citation when the candidate set did not already hold it. The increment is identical on every page.'
        matchMode:
          type: string
          enum: [and, or]
          description: "The tier the candidate set came from. The OR tier is the only candidate tier, so this always reports 'or'; a provision matching EVERY query term ranks ahead of one that matches only some. The field stays for wire compatibility."
        hits:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        indexIssueDate: { type: [string, 'null'] }
        indexStale: { type: boolean }
        notice:
          {
            type: [string, 'null'],
            description: 'Stale-index warning. NOTE: `notice` is NOT one field with one meaning across the API — on the search and section responses it is the stale-index warning, while on the diff and redline responses it is the date-semantics disclaimer. A client that renders a generic `notice` must not generalise from one to the other.',
          }
        matchedTerms:
          type: array
          items: { type: string }
          description: "The query's content terms the returned hits answered (stopwords, single characters and bare numerals removed). A term counts as answered when a hit carries its words or every word of one of the corpus phrases it stands for."
        unmatchedTerms:
          type: array
          items: { type: string }
          description: "The query's content terms NO returned hit answered. This describes the RESULTS, never what Title 38 covers: a term can be unmatched because the governing provision is outside the returned window, because it uses other words, or because the corpus does not discuss it."
      additionalProperties: false
    SearchHit:
      type: object
      required:
        - citation
        - heading
        - part
        - path
        - snippet
        - score
        - matches
        - citationDisplay
        - sourceUrl
        - sourceUrlAtIndexDate
        - direct
        - inResults
        - partTitle
      properties:
        citation: { type: string }
        heading: { type: string }
        part: { type: [string, 'null'] }
        path: { type: string }
        snippet: { type: string }
        score: { type: number, description: 'bm25 — lower is better.' }
        matches:
          type: array
          items: { type: string }
          description: 'Query terms this hit answered — the term itself, or the corpus phrase a synonym stands for (a hit that matched "special monthly compensation" answers the term "smc").'
        citationDisplay: { type: string, description: 'Paste-ready form, e.g. 38 C.F.R. § 4.130.' }
        sourceUrl: { type: string, format: uri }
        sourceUrlAtIndexDate:
          {
            type: string,
            format: uri,
            description: 'The same provision at the index issue date: the URL that proves which revision the text was read at. `sourceUrl` is the CURRENT text.',
          }
        direct: { type: boolean, description: Pinned hit (query was this citation). }
        inResults:
          {
            type: boolean,
            description: 'True when the section matched the ranked search. Always true for non-pin hits; for a pin (`direct: true`) it reports whether the pin also appeared in the ranked results.',
          }
        partTitle:
          {
            type: [string, 'null'],
            description: 'The part title from the index structure tree, without the "Part N—" prefix; null when unknown.',
          }
      additionalProperties: false
    SectionDetail:
      type: object
      required:
        - citation
        - kind
        - heading
        - chapter
        - part
        - subpart
        - path
        - issueDate
        - markdown
        - text
        - sourceUrl
        - sourceUrlAtIndexDate
        - references
        - citedBy
        - indexStale
        - notice
      properties:
        citation: { type: string }
        kind: { type: string, enum: [section, appendix] }
        heading: { type: string }
        chapter: { type: [string, 'null'] }
        part: { type: [string, 'null'] }
        subpart: { type: [string, 'null'] }
        path: { type: string }
        issueDate: { type: string }
        markdown: { type: string }
        text: { type: string }
        sourceUrl: { type: string, format: uri }
        sourceUrlAtIndexDate:
          type: string
          format: uri
          description: >-
            The same provision at the revision this index was built from (the
            eCFR point-in-time URL for the index's issue date). `sourceUrl`
            points at the CURRENT text; this one points at the text the
            index actually holds. eCFR serves the point-in-time archive only
            from 2017 onward (measured 2026-10-20), so for an index older
            than that the link names the revision correctly but will not
            resolve.
        references:
          type: array
          items:
            type: object
            required: [citation, available]
            properties:
              citation: { type: string }
              available: { type: boolean, description: Whether the cited provision is indexed. }
              additionalProperties: false
        citedBy:
          type: array
          items: { type: string }
          description: 'Citations of indexed sections whose text references this one (reverse cross-references), sorted.'
        indexStale: { type: boolean }
        notice: { type: [string, 'null'] }
      additionalProperties: false
    BrowseResult:
      type: object
      required: [node, path, children]
      properties:
        node: { $ref: '#/components/schemas/StructureEntry' }
        path:
          type: array
          items: { $ref: '#/components/schemas/StructureEntry' }
          description: Ancestors of `node`, root first.
        children:
          type: array
          items: { $ref: '#/components/schemas/StructureEntry' }
      additionalProperties: false
    StructureEntry:
      type: object
      required: [type, identifier, label]
      properties:
        type: { type: string, description: 'e.g. title, chapter, part, subpart, section.' }
        identifier: { type: string }
        label: { type: string }
      additionalProperties: false
    DiffResult:
      type: object
      description: 'Provision-level diff of Title 38 between two eCFR issue dates — both dates fetched from eCFR and hashed per citation on the fly (stateless; no local index involved).'
      required:
        - fromIssueDate
        - toIssueDate
        - changed
        - added
        - removed
        - truncated
        - notice
      properties:
        fromIssueDate: { type: string, description: 'The `from` date as requested (YYYY-MM-DD).' }
        toIssueDate: { type: string, description: 'The `to` date as requested (YYYY-MM-DD).' }
        changed:
          type: array
          items: { type: string }
          description: >-
            Citations present at both dates whose content differs — the text
            or the heading — sorted. Capped at 100. A provision retitled with
            an unchanged body counts as changed.
        added:
          type: array
          items: { type: string }
          description: Citations present only at the to-date, sorted. Capped at 100.
        removed:
          type: array
          items: { type: string }
          description: Citations present only at the from-date, sorted. Capped at 100.
        truncated:
          type: boolean
          description: True when any of the three citation lists was cut at the 100-entry cap.
        notice:
          type: string
          description: 'The limit on what the two dates MEAN, stated on the surface that shows the comparison: eCFR serves the revision in force on the requested date and does not report which issue date that is, so the dates are selectors and not a stamp of the revision served.'
      additionalProperties: false
    RedlineResult:
      type: object
      description: 'Line redline of one provision between two eCFR issue dates — both dates fetched from eCFR and parsed on the fly (stateless; no local index involved). The dates are SELECTORS: eCFR serves the revision in force on the requested date, not a verified issue-date stamp.'
      required:
        - fromIssueDate
        - toIssueDate
        - citation
        - status
        - hunks
        - coarse
        - notice
      properties:
        fromIssueDate:
          {
            type: string,
            description: 'The `from` date as requested (YYYY-MM-DD) — a selector, not a verified issue-date stamp.',
          }
        toIssueDate:
          {
            type: string,
            description: 'The `to` date as requested (YYYY-MM-DD) — a selector, not a verified issue-date stamp.',
          }
        citation:
          type: string
          description: Canonical citation of the matched provision (the XML row's `N` attribute).
        status:
          type: string
          enum: [changed, added, removed, unchanged]
          description: Lifecycle of the provision across the two dates.
        fromText:
          type: [string, 'null']
          description: Absent when the provision did not exist on the from-date.
        toText:
          type: [string, 'null']
          description: Absent when the provision did not exist on the to-date.
        hunks:
          type: array
          description: One hunk per line (a `same` line, an `add`, or a `del`); empty for unchanged.
          items:
            type: object
            required: [fromLine, toLine, type, text]
            properties:
              fromLine:
                {
                  type: [integer, 'null'],
                  description: '1-based anchor into the from-text; null on additions.',
                }
              toLine:
                {
                  type: [integer, 'null'],
                  description: '1-based anchor into the to-text; null on deletions.',
                }
              type: { type: string, enum: [same, add, del] }
              text: { type: string }
            additionalProperties: false
        coarse:
          type: boolean
          description: True when either side exceeded the core's 2000-line cap — `hunks` then holds two whole-text blocks (not an LCS walk), so no per-line identity is claimed.
        notice:
          type: string
          description: 'The limit on what the two dates MEAN, stated on the surface that shows the comparison: eCFR serves the revision in force on the requested date and does not report which issue date that is, so the dates are selectors and not a stamp of the revision served.'
      additionalProperties: false
