# Static OpenAPI 3.1 description of the Titan HTTP API (SPEC §5). Derived from
# the router in src/titan/http-server.ts (source of truth; nothing serves this
# file). Each `paths:` entry cites its router line as
# `# source: src/titan/http-server.ts#symbol` (shared error responses cite the
# symbols that send them too) so code/doc drift is easy to spot. The anchor is
# a SYMBOL, not a line: the conformance suite resolves it in the cited file, so
# inserting a line above a route does not invalidate the doc's provenance.
openapi: 3.1.0
info:
  title: cfr-free Titan HTTP API
  version: 0.1.0 # keep in sync with package.json
  license: { identifier: MIT }
  description: |
    GET-only JSON surface over the local Title 38 index (plus `/api/v1/diff`
    and `/api/v1/redline`, the two routes that fetch from eCFR on demand
    instead of reading the index). Design authority:
    [docs/SPEC.md §5](docs/SPEC.md#5-titan-http-api-get-only-json-bind-127001).
    No request bodies, no auth (loopback bind by default; `CFR_ALLOW_REMOTE=1`
    is required to expose it); every `GET` route has a `HEAD` twin with
    identical status/headers and an empty body (src/titan/http-server.ts#sendJson),
    and the non-JSON routes are `GET /metrics` (Prometheus exposition) and the
    read-only web UI (`GET /`, `/ui.js`, `/ui.css` — the HTML shell is a string
    constant in src/titan/ui.ts, while the script and the stylesheet are real
    files (src/titan/ui-client.js, src/titan/ui-client.css) that the build
    copies into dist/ so the gate's linter and formatter can see them; the
    document ships a strict Content-Security-Policy and zero inline script).
    The three index-backed reads (`/api/v1/search`, `/api/v1/sections/{citation}`,
    `/api/v1/browse`) carry a strong `ETag` over the response payload and answer
    a matching `If-None-Match` with a bodyless `304` (RFC 9110 §13.1.2); the
    eCFR-fetching routes, `/health`, `/metrics` and every error response carry
    no validator.
    Errors are JSON `{ error, message }`; paths not listed under `paths` return
    404, and any method other than `GET`/`HEAD` returns 405 with
    `allow: GET, HEAD`. All schema fields listed under `required` are always
    present (the optional `Health.diskFree`/`diskTotal` and
    `RedlineResult.fromText`/`toText` are the deliberate exceptions); nullable
    ones use OpenAPI 3.1 `type: [string, "null"]` (never `nullable: true`).
servers:
  - url: http://127.0.0.1:8787
    description: Default loopback bind (CFR_HOST/CFR_PORT may override deliberately).
paths:
  /:
    # source: src/titan/http-server.ts#dispatch
    get:
      summary: Read-only web UI (HTML shell)
      responses:
        '200':
          description: 'Static single-page web UI shell (search + section reader, hash-routed against the JSON API below). Sent with a strict Content-Security-Policy (no inline script/style), X-Content-Type-Options: nosniff, CORP same-origin, Cache-Control: no-store.'
          content:
            text/html:
              schema: { type: string }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    head:
      summary: Headers-only web UI probe
      responses:
        '200':
          description: 'Status and headers as GET, including the Content-Security-Policy, empty body (src/titan/http-server.ts#sendStatic); errors mirror GET, also body-less.'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /ui.js:
    # source: src/titan/http-server.ts#dispatch
    get:
      summary: Web UI script (a real file, linted and copied into dist/ at build time)
      responses:
        '200':
          description: 'The UI page script as text/javascript — served from src/titan/ui-client.js, which the build copies into dist/ so the gate can lint and format it, nosniff + CORP same-origin + Cache-Control: no-store via sendStatic (src/titan/http-server.ts#sendStatic).'
          content:
            text/javascript:
              schema: { type: string }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    head:
      summary: Headers-only web UI script probe
      responses:
        '200':
          description: 'Status and headers as GET, empty body (src/titan/http-server.ts#sendStatic); errors mirror GET, also body-less.'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /ui.css:
    # source: src/titan/http-server.ts#dispatch
    get:
      summary: Web UI stylesheet (a real file, linted and copied into dist/ at build time)
      responses:
        '200':
          description: 'The UI stylesheet as text/css — served from src/titan/ui-client.css, which the build copies into dist/ so the gate can lint and format it, nosniff + CORP same-origin + Cache-Control: no-store via sendStatic (src/titan/http-server.ts#sendStatic).'
          content:
            text/css:
              schema: { type: string }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    head:
      summary: Headers-only web UI stylesheet probe
      responses:
        '200':
          description: 'Status and headers as GET, empty body (src/titan/http-server.ts#sendStatic); errors mirror GET, also body-less.'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /openapi.yaml:
    # source: src/titan/http-server.ts#handleDiscovery
    get:
      summary: The OpenAPI description of this API
      responses:
        '200':
          description: 'This document, served as application/yaml so a running instance carries its own contract. Cache-Control: no-store.'
          content:
            application/yaml:
              schema: { type: string }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    head:
      summary: Headers-only OpenAPI document
      responses:
        '200':
          description: 'Status and headers as GET, empty body (src/titan/http-server.ts#sendStatic); errors mirror GET, also body-less.'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /health:
    # source: src/titan/http-server.ts#dispatch
    get:
      summary: Index freshness report
      responses:
        '200':
          description: '{ status: "ok", ...service.status() } — issue date, counts, staleness, drift, last sync changes, corpus receipt hash (null on pre-receipt indexes); diskFree/diskTotal present when the platform exposes fs.statfs (as of boot or last refresh round). Cache-Control: no-store.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    head:
      summary: Headers-only health check
      responses:
        '200':
          description: 'Status and headers as GET, empty body (src/titan/http-server.ts#sendJson); errors mirror GET, also body-less.'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /metrics:
    # source: src/titan/http-server.ts#dispatch
    get:
      summary: Prometheus exposition
      responses:
        '200':
          description: 'cfr_free_* gauges — including cfr_free_disk_free_bytes and cfr_free_disk_total_bytes when a statfs snapshot exists (see SPEC §5); served as text/plain; version=0.0.4. Cache-Control: no-store.'
          content:
            text/plain:
              schema: { type: string }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
    head:
      summary: Headers-only metrics check
      responses:
        '200':
          description: 'Status and headers as GET, empty body (src/titan/http-server.ts#sendJson); errors mirror GET, also body-less.'
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1:
    # source: src/titan/http-server.ts#handleDiscovery
    get:
      summary: API index — the routes this instance serves
      responses:
        '200':
          description: 'The routes, their summaries and the parameters each requires. Cache-Control: no-store.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiIndex' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '414': { $ref: '#/components/responses/UriTooLong' }
