# SonarQube / SonarCloud project configuration.
# The CI "sonar" job runs only when SONAR_TOKEN (and optionally
# SONAR_HOST_URL for SonarQube) is configured for the repository.

sonar.projectKey=deffenda_cfr-free
sonar.projectName=cfr-free

sonar.sources=src
sonar.tests=test
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,tools/**
sonar.test.inclusions=test/**

sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverageReportPaths=coverage/coverage-summary.json

sonar.sourceEncoding=UTF-8
# Keep SonarQube's maintainability/security ratings aligned with the
# strict local gates (eslint security plugin, npm audit, scanners).
sonar.javascript.globals=process,fetch,AbortSignal
